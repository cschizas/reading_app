name: Daily Reading Email

on:
  schedule:
    # 06:00 UTC = 09:00 Athens (EEST, summer) / 08:00 (EET, winter)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  send-reading:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Use default GITHUB_TOKEN so the bot can push the history update
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install \
            anthropic \
            google-api-python-client \
            google-auth-httplib2 \
            google-auth-oauthlib \
            pypdf \
            python-docx

      - name: Send reading email
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python scripts/send_reading.py

      - name: Commit updated sent history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sent_history.json
          git diff --staged --quiet || git commit -m "chore: update sent history [skip ci]"
          git push
